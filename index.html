<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konzept: LiveDeal + VIPSwiss Oekosystem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0B0E1A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;padding:40px 20px;max-width:600px}
h1{font-size:2rem;margin-bottom:8px}
h1 span{color:#C9A84C}
p{color:rgba(255,255,255,.5);margin-bottom:40px;line-height:1.6}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
a.card{display:block;padding:40px 32px;border-radius:16px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:all .4s;text-decoration:none;color:#fff;flex:1;min-width:220px}
a.card:hover{border-color:#C9A84C;transform:translateY(-4px);box-shadow:0 20px 60px rgba(201,168,76,.15)}
.card .icon{font-size:2.5rem;margin-bottom:16px}
.card h2{font-size:1.2rem;margin-bottom:6px}
.card p{font-size:.9rem;color:rgba(255,255,255,.4);margin-bottom:0}
.card.live h2{color:#DC2626}
.card.vip h2{color:#C9A84C}
</style>
</head>
<body>
<div class="wrap">
<h1>Live<span style="color:#DC2626">Deal</span> + <span>VIP</span>Swiss</h1>
<p>Zwei Plattformen. Ein Oekosystem. Waehle ein Konzept zum Anschauen.</p>
<div class="cards">
<a class="card live" href="livedeal.html"><div class="icon">&#128293;</div><h2>LiveDeal.ch</h2><p>Die Deals-Plattform</p></a>
<a class="card vip" href="vipswiss.html"><div class="icon">&#11088;</div><h2>VIPSwiss.ch</h2><p>Die Premium-Mitgliedschaft</p></a>
</div>
</div>
</body>
</html>
